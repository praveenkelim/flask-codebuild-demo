version: 0.2

phases:

  install:
    runtime-versions:
      python: 3.12

    commands:
      - echo Installing dependencies...
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo Running Tests...
      - pytest

  build:
    commands:
      - echo Build Started...
      - zip -r flask-app.zip .

artifacts:
  files:
    - imagedefinitions.json
