version: 0.2

phases:

  install:
    runtime-versions:
      python: 3.12

    commands:
      - echo Installing dependencies...
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo Running Tests...
      - pytest

   build:
    commands:
      - echo Creating image definitions...
      - printf '[{"name":"Main","imageUri":"622623003948.dkr.ecr.us-east-1.amazonaws.com/varanasi:latest"}]' > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
